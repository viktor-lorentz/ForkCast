<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ForkCast cover</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 3000px; height: 2000px; overflow: hidden; }
  body {
    background: #f5f5f7;
    font-family: -apple-system, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: #1d1d1f;
    -webkit-font-smoothing: antialiased;
    position: relative;
  }
  .top { position: absolute; top: 120px; left: 0; right: 0; text-align: center; }
  .brand { display: inline-flex; align-items: center; gap: 18px; font-size: 52px; font-weight: 600; letter-spacing: -0.01em; }
  .brand img { height: 58px; }
  h1 { margin-top: 34px; font-size: 168px; font-weight: 700; letter-spacing: -0.045em; line-height: 1; }
  h1 span { color: #990000; }
  .sub { margin-top: 36px; font-size: 52px; font-weight: 400; color: #6e6e73; letter-spacing: -0.01em; }

  .phones { position: absolute; left: 0; right: 0; top: 640px; height: 1500px; }
  .phone {
    position: absolute; width: 640px; height: 1388px; border-radius: 108px; padding: 20px;
    background: linear-gradient(145deg, #3a3a3c, #1d1d1f 40%, #2c2c2e);
    box-shadow: 0 0 0 3px #48484a inset, 0 60px 120px -30px rgba(0,0,0,.28), 0 30px 60px -30px rgba(0,0,0,.25);
  }
  .phone .screen { width: 100%; height: 100%; border-radius: 90px; overflow: hidden; background: #fff; position: relative; }
  .phone .screen img { width: 100%; display: block; }
  .phone .island { position: absolute; top: 34px; left: 50%; transform: translateX(-50%); width: 190px; height: 56px; border-radius: 30px; background: #000; z-index: 2; }
  .phone .screen::before { content: ""; display: block; height: 0; }
  .center { left: 50%; margin-left: -320px; top: 0; z-index: 3; }
  .left { left: 50%; margin-left: -1010px; top: 130px; z-index: 2; transform: scale(.9); transform-origin: top center; }
  .right { left: 50%; margin-left: 370px; top: 130px; z-index: 2; transform: scale(.9); transform-origin: top center; }
  /* The screenshots start below the status bar, so leave room for the island. */
  .pad { height: 70px; background: var(--bar, #f5f5f7); }
  .right .pad { --bar: #0c0c0e; }
  .right .screen { background: #0c0c0e; }

  .foot { position: absolute; bottom: 0; left: 0; right: 0; height: 260px; background: linear-gradient(to top, #f5f5f7 30%, rgba(245,245,247,0)); z-index: 5; }
  .url { position: absolute; bottom: 70px; left: 0; right: 0; text-align: center; z-index: 6; font-size: 34px; color: #86868b; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="top">
    <div class="brand"><img src="logo-mark.png" alt="" />ForkCast</div>
    <h1>Know before <span>you go.</span></h1>
    <p class="sub">The USC dining hall that fits how you eat. Every meal.</p>
  </div>

  <div class="phones">
    <div class="phone left"><div class="island"></div><div class="screen"><div class="pad"></div><img src="screen-setup.png" alt="" /></div></div>
    <div class="phone right"><div class="island"></div><div class="screen"><div class="pad"></div><img src="screen-pick-dark.png" alt="" /></div></div>
    <div class="phone center"><div class="island"></div><div class="screen"><div class="pad"></div><img src="screen-pick.png" alt="" /></div></div>
  </div>

</body>
</html>
