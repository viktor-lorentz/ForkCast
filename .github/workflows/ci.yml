name: CI

# Runs on every pull request and every push to main.
# A PR can only be merged when lint, tests (including the allergen-safety
# profiles) and the production build all pass.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Read menus from data/snapshots so CI never depends on USC's live site.
      DEMO_MODE: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test (incl. "never recommends a flagged dish")
        run: npm test

      - name: Build
        run: npm run build
